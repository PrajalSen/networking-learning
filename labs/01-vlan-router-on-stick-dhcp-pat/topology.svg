<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".18"/></filter></defs>
<rect width="1400" height="760" fill="#f8fafc"/>
<text x="700" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">VLAN + Router-on-a-Stick + DHCP + PAT Lab</text>
<text x="700" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">Configure → Verify → Route → Translate → Test</text>

<!-- devices -->
<g filter="url(#shadow)"><rect x="55" y="190" width="190" height="105" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="150" y="225" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">PCs</text><text x="150" y="253" text-anchor="middle" font-family="Arial" font-size="16">DHCP Clients</text><text x="150" y="278" text-anchor="middle" font-family="Arial" font-size="14">VLAN 10 / VLAN 20</text></g>
<g filter="url(#shadow)"><rect x="300" y="190" width="205" height="105" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="402" y="225" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Switch</text><text x="402" y="253" text-anchor="middle" font-family="Arial" font-size="16">Access Ports</text><text x="402" y="278" text-anchor="middle" font-family="Arial" font-size="14">Fa0/3 = Trunk 802.1Q</text></g>
<g filter="url(#shadow)"><rect x="570" y="165" width="260" height="155" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="700" y="202" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">R1</text><text x="700" y="230" text-anchor="middle" font-family="Arial" font-size="15">Router-on-a-Stick</text><text x="700" y="257" text-anchor="middle" font-family="Arial" font-size="14">G0/0.10 → 192.168.10.1</text><text x="700" y="280" text-anchor="middle" font-family="Arial" font-size="14">G0/0.20 → 192.168.20.1</text><text x="700" y="303" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700">DHCP + PAT</text></g>
<g filter="url(#shadow)"><rect x="905" y="190" width="205" height="105" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="1007" y="225" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">ISP Router</text><text x="1007" y="253" text-anchor="middle" font-family="Arial" font-size="16">G0/0 = 200.1.1.2</text><text x="1007" y="278" text-anchor="middle" font-family="Arial" font-size="14">Next hop for R1</text></g>
<g filter="url(#shadow)"><rect x="1180" y="190" width="165" height="105" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="3"/><text x="1262" y="225" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Internet</text><text x="1262" y="253" text-anchor="middle" font-family="Arial" font-size="16">Loopback</text><text x="1262" y="278" text-anchor="middle" font-family="Arial" font-size="14">8.8.8.8</text></g>

<!-- links -->
<line x1="245" y1="242" x2="300" y2="242" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
<line x1="505" y1="242" x2="570" y2="242" stroke="#334155" stroke-width="6" marker-end="url(#arrow)"/>
<line x1="830" y1="242" x2="905" y2="242" stroke="#334155" stroke-width="6" marker-end="url(#arrow)"/>
<line x1="1110" y1="242" x2="1180" y2="242" stroke="#334155" stroke-width="6" marker-end="url(#arrow)"/>
<text x="535" y="220" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#4f46e5">TRUNK</text><text x="867" y="220" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#16a34a">PAT / NAT</text>

<!-- flow cards -->
<text x="700" y="380" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#0f172a">What happens in the lab?</text>
<g font-family="Arial">
<rect x="70" y="420" width="230" height="125" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="185" y="455" text-anchor="middle" font-size="20" font-weight="700">1. VLAN</text><text x="185" y="483" text-anchor="middle" font-size="14">Separate users logically</text><text x="185" y="508" text-anchor="middle" font-size="14">VLAN 10 = HR</text><text x="185" y="530" text-anchor="middle" font-size="14">VLAN 20 = IT</text>
<rect x="330" y="420" width="230" height="125" rx="16" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/><text x="445" y="455" text-anchor="middle" font-size="20" font-weight="700">2. Trunk</text><text x="445" y="483" text-anchor="middle" font-size="14">Carries multiple VLANs</text><text x="445" y="508" text-anchor="middle" font-size="14">802.1Q tagging</text><text x="445" y="530" text-anchor="middle" font-size="14">Switch ↔ R1</text>
<rect x="590" y="420" width="230" height="125" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="705" y="455" text-anchor="middle" font-size="20" font-weight="700">3. Routing</text><text x="705" y="483" text-anchor="middle" font-size="14">Subinterfaces become</text><text x="705" y="508" text-anchor="middle" font-size="14">VLAN default gateways</text><text x="705" y="530" text-anchor="middle" font-size="14">10.1 / 20.1</text>
<rect x="850" y="420" width="230" height="125" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="965" y="455" text-anchor="middle" font-size="20" font-weight="700">4. DHCP</text><text x="965" y="483" text-anchor="middle" font-size="14">DORA gives clients</text><text x="965" y="508" text-anchor="middle" font-size="14">IP + mask + gateway</text><text x="965" y="530" text-anchor="middle" font-size="14">+ DNS</text>
<rect x="1110" y="420" width="230" height="125" rx="16" fill="#fce7f3" stroke="#f472b6" stroke-width="2"/><text x="1225" y="455" text-anchor="middle" font-size="20" font-weight="700">5. PAT</text><text x="1225" y="483" text-anchor="middle" font-size="14">Many private IPs share</text><text x="1225" y="508" text-anchor="middle" font-size="14">200.1.1.1 + ports</text><text x="1225" y="530" text-anchor="middle" font-size="14">toward ISP</text>
</g>

<!-- verification -->
<rect x="115" y="595" width="1170" height="105" rx="18" fill="#0f172a"/>
<text x="700" y="625" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#ffffff">VERIFY AFTER CONFIGURATION</text>
<text x="700" y="654" text-anchor="middle" font-family="monospace" font-size="15" fill="#e2e8f0">show vlan brief  •  show interfaces trunk  •  show ip interface brief</text>
<text x="700" y="680" text-anchor="middle" font-family="monospace" font-size="15" fill="#e2e8f0">show ip dhcp binding  •  show ip nat translations  •  ping 8.8.8.8</text>
</svg>