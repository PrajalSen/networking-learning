<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="680" rx="18" fill="none" stroke="#1f2937" stroke-width="3"/>
  <text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111827">LAB 01 — VLAN BASICS</text>
  <text x="600" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4b5563">Layer 2 VLAN Segmentation</text>

  <rect x="55" y="135" width="350" height="300" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="230" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#15803d">VLAN 10 — HR</text>

  <rect x="795" y="135" width="350" height="300" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="970" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1d4ed8">VLAN 20 — IT</text>

  <rect x="500" y="185" width="200" height="115" rx="15" fill="#e5e7eb" stroke="#374151" stroke-width="3"/>
  <text x="600" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#111827">SW1</text>
  <text x="600" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#374151">Cisco 2960</text>
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">Layer 2 Switch</text>

  <g font-family="Arial, sans-serif">
    <rect x="105" y="220" width="145" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="177" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">PC1</text>
    <text x="177" y="274" text-anchor="middle" font-size="14" fill="#374151">192.168.10.10/24</text>
    <text x="177" y="292" text-anchor="middle" font-size="13" fill="#15803d">Fa0/1</text>

    <rect x="105" y="330" width="145" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="177" y="360" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">PC2</text>
    <text x="177" y="384" text-anchor="middle" font-size="14" fill="#374151">192.168.10.11/24</text>
    <text x="177" y="402" text-anchor="middle" font-size="13" fill="#15803d">Fa0/2</text>

    <rect x="950" y="220" width="145" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="1022" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">PC3</text>
    <text x="1022" y="274" text-anchor="middle" font-size="14" fill="#374151">192.168.20.10/24</text>
    <text x="1022" y="292" text-anchor="middle" font-size="13" fill="#1d4ed8">Fa0/3</text>

    <rect x="950" y="330" width="145" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="1022" y="360" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">PC4</text>
    <text x="1022" y="384" text-anchor="middle" font-size="14" fill="#374151">192.168.20.11/24</text>
    <text x="1022" y="402" text-anchor="middle" font-size="13" fill="#1d4ed8">Fa0/4</text>
  </g>

  <g stroke="#111827" stroke-width="4" fill="none">
    <line x1="250" y1="260" x2="500" y2="240"/>
    <line x1="250" y1="370" x2="500" y2="270"/>
    <line x1="700" y1="240" x2="950" y2="260"/>
    <line x1="700" y1="270" x2="950" y2="370"/>
  </g>

  <rect x="55" y="470" width="1090" height="165" rx="15" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="600" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Connectivity Expectations</text>
  <text x="120" y="545" font-family="Arial, sans-serif" font-size="18" fill="#15803d">✓ PC1 ↔ PC2</text>
  <text x="300" y="545" font-family="Arial, sans-serif" font-size="18" fill="#374151">Same VLAN 10 — should work</text>
  <text x="120" y="580" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">✓ PC3 ↔ PC4</text>
  <text x="300" y="580" font-family="Arial, sans-serif" font-size="18" fill="#374151">Same VLAN 20 — should work</text>
  <text x="690" y="545" font-family="Arial, sans-serif" font-size="18" fill="#dc2626">✗ PC1 ↔ PC3</text>
  <text x="870" y="545" font-family="Arial, sans-serif" font-size="18" fill="#374151">Different VLANs — blocked</text>
  <text x="690" y="580" font-family="Arial, sans-serif" font-size="18" fill="#374151">No Layer 3 routing configured</text>
  <text x="600" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">Access ports: Fa0/1–Fa0/2 → VLAN 10 | Fa0/3–Fa0/4 → VLAN 20</text>
</svg>